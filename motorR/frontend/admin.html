<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivero - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main class="container py-4">
        <div class="card shadow-sm garden-card border-0">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-garden">Gestión del Vivero</h1>
                <form id="productForm" class="row g-3">
                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-bold">Especie / Artículo</label>
                        <input class="form-control garden-input" id="name" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-bold">Precio</label>
                        <input id="precio" type="number" 
                         min="1" class="form-control garden-input" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label class="form-label text-muted small fw-bold">Stock en Vivero</label>
                        <input id="stock" type="number" 
                         min="0" class="form-control garden-input" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small fw-bold">Fotografía</label>
                        <input id="image" type="file" accept="image/*" 
                        class="form-control garden-input" required>
                    </div>
                    <div class="col-12">
                        <div id="status" class="small text-muted"></div>
                    </div>
                    <div class="col-12">
                        <img id="preview" class="img-thumbnail rounded-4 d-none"
                         style="max-height: 240px; border: 1px solid var(--garden-border); background-color: white;">
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button id="saveBtn" class="btn btn-garden px-4">Plantar Artículo</button>
                        <a href="./index.html" class="btn btn-garden-outline px-4">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <script type = "module" src="./js/admin.js"></script>
    
</body>
</html>
